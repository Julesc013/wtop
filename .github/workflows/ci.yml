name: Wtop checks

on:
  push:
    branches: [master, 'work/**']
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wtop-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  specification-and-core:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Validate specification and tooling
        run: |
          python tools/specctl.py validate
          python tools/command_help.py --check
          python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Build portable C90 core and isolated Unicode adapter with sanitizers
        run: |
          cmake -S . -B out/host -DCMAKE_BUILD_TYPE=Debug -DCMAKE_C_FLAGS='-Wall -Wextra -Wpedantic -fsanitize=address,undefined -fno-omit-frame-pointer' -DCMAKE_EXE_LINKER_FLAGS='-fsanitize=address,undefined'
          cmake --build out/host --parallel 2
          ctest --test-dir out/host --output-on-failure

  windows:
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: Win32
            runner: windows-2025
            python_arch: x64
          - arch: x64
            runner: windows-2025
            python_arch: x64
          - arch: ARM64
            runner: windows-11-arm
            python_arch: arm64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
          architecture: ${{ matrix.python_arch }}
      - name: Configure and build current Windows profile
        run: |
          cmake -S . -B out/windows -A ${{ matrix.arch }}
          cmake --build out/windows --config Release --parallel 2
      - name: Run native CLI, TUI and portable checks
        run: |
          if ('${{ matrix.arch }}' -eq 'x64') {
            # Exercise the moved entrypoint from outside the checkout.
            Push-Location $env:RUNNER_TEMP
            try {
              & "$env:GITHUB_WORKSPACE\source\build.bat" -release
              if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            } finally { Pop-Location }
          } else {
            ctest --test-dir out/windows -C Release --output-on-failure
          }
      - name: Retain native console diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: wtop-native-checks-${{ matrix.arch }}-${{ github.sha }}
          path: |
            out/windows/native-tui-observations.json
            out/windows/native-provider-observations.json
            out/windows/native-resource-observations.json
            out/windows/Testing/Temporary/LastTest.log
          if-no-files-found: ignore
          retention-days: 14
      - name: Inspect and package the exact candidate payload
        shell: pwsh
        run: |
          $profile = @{ Win32 = 'win-nt-x86'; x64 = 'win-nt-x64'; ARM64 = 'win-nt-arm64' }['${{ matrix.arch }}']
          python packaging/record_build.py out/windows out/build-provenance.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tools/package_candidate.py create --exe out/windows/Release/wtop.exe --output out/candidate --profile $profile --provenance out/build-provenance.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tools/package_candidate.py verify out/candidate
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build pinned modern MSI candidate
        if: matrix.arch != 'Win32'
        shell: pwsh
        env:
          DOTNET_ROLL_FORWARD: Major
        run: |
          dotnet tool install wix --tool-path out/wix --version 4.0.6
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python packaging/build_msi.py --candidate out/candidate --stage out/msi-stage --wix out/wix/wix.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Qualify direct MSI ownership and refusal fixtures
        if: matrix.arch != 'Win32'
        shell: pwsh
        run: |
          # Server's unmanaged-install policy is verified, never changed. The
          # Windows 11 ARM64 client must pass the full restricted-user lifecycle.
          $policyArgs = @()
          if ('${{ matrix.arch }}' -eq 'x64') { $policyArgs = @('--expect-restricted-user-policy-refusal') }
          python tests/test_native_install.py out/candidate --disposable-host --machine --restricted-user @policyArgs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify candidate cannot be promoted as a supported release
        shell: pwsh
        run: |
          python tools/package_candidate.py verify out/candidate
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tools/package_candidate.py promote out/candidate
          if ($LASTEXITCODE -ne 2) { throw 'Unqualified candidate unexpectedly passed promotion.' }
          exit 0
      - name: Retain exact candidate bytes and installer observations
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: wtop-${{ matrix.arch }}-candidate-${{ github.sha }}
          path: |
            out/candidate/**
            out/build-provenance.json
          if-no-files-found: warn
          retention-days: 14

# Candidates never create a tag or release. The inherited workflow published a
# nominal stable release on every master push; publishing now requires its own
# explicit qualification work unit.
