name: Wtop source snapshot

on:
  push:
    branches: [master, 'work/public-beta-*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Archive the exact checked-out source and history
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out/source
          git archive --format=tar --prefix=wtop/ HEAD | gzip -n > out/source/wtop-source.tar.gz
          git bundle create out/source/wtop-history.bundle HEAD
          git rev-parse HEAD > out/source/SOURCE_COMMIT
          git rev-parse 'HEAD^{tree}' > out/source/SOURCE_TREE
          (cd out/source && sha256sum wtop-source.tar.gz wtop-history.bundle > SHA256SUMS)
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: wtop-source-${{ github.sha }}
          path: out/source/
          if-no-files-found: error
          retention-days: 14

# This read-only build job does not create tags, releases or support claims.
