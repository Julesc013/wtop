name: Wtop portable prerelease draft

on:
  push:
    branches: [master, 'work/public-beta-*', 'work/beta3-*']
  pull_request:
    branches: [master]
  workflow_dispatch:
    inputs:
      operation:
        description: 'Stage a verified draft, or explicitly publish an existing alpha/beta after its recorded gates'
        type: choice
        options: [stage, publish]
        default: stage
      tag:
        description: 'Existing draft tag, required only for publish'
        type: string
        default: v0.4.0-beta.3

permissions:
  contents: read

concurrency:
  group: wtop-beta-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    if: github.event_name != 'workflow_dispatch' || inputs.operation != 'publish'
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: Win32
            profile: win-nt-x86
            runner: windows-2025
            python_arch: x64
          - arch: x64
            profile: win-nt-x64
            runner: windows-2025
            python_arch: x64
          - arch: ARM64
            profile: win-nt-arm64
            runner: windows-11-arm
            python_arch: arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
          architecture: ${{ matrix.python_arch }}
      - name: Validate specification and release tooling
        shell: pwsh
        run: |
          python tools/specctl.py validate
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tools/command_help.py --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m unittest discover -s tests -p 'test_*.py' -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build the embedded beta version
        shell: pwsh
        run: |
          cmake -S . -B out/beta-windows -A ${{ matrix.arch }}
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmake --build out/beta-windows --config Release --parallel 2
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Record and package the immutable application candidate
        id: candidate
        shell: pwsh
        run: |
          python packaging/record_build.py out/beta-windows out/beta-provenance.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tools/package_candidate.py create --exe out/beta-windows/Release/wtop.exe --output out/beta-candidate --profile ${{ matrix.profile }} --provenance out/beta-provenance.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tools/package_candidate.py verify out/beta-candidate
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Execute final native and TUI tests on the declared host
        shell: pwsh
        run: |
          ctest --test-dir out/beta-windows -C Release --output-on-failure --output-junit native-tests.xml
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Record unchanged final bytes and native receipts
        shell: pwsh
        run: |
          Copy-Item out/beta-windows/native-tests.xml out/beta-candidate/native-tests.xml
          python packaging/native_receipt.py out/beta-candidate --junit out/beta-candidate/native-tests.xml --output out/beta-candidate/native-receipt.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python packaging/security_scan.py out/beta-candidate --output out/beta-candidate/security-scan.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tools/package_candidate.py verify out/beta-candidate
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build exact-payload experimental MSI and exercise its lifecycle
        # Exercise the independent installer boundary even when native runtime
        # tests failed. A failed native/MSI step still fails this entire job;
        # assembly and publication retain their successful-build dependency.
        if: ${{ !cancelled() && steps.candidate.outcome == 'success' && matrix.arch != 'Win32' }}
        shell: pwsh
        env:
          DOTNET_ROLL_FORWARD: Major
        run: |
          dotnet tool install wix --tool-path out/wix --version 4.0.6
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python packaging/build_msi.py --candidate out/beta-candidate --stage out/beta-msi-stage --wix out/wix/wix.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          # Server's unmanaged-install policy is verified, never changed. The
          # Windows 11 ARM64 client must pass under a fresh standard account.
          $contextArgs = @('--standard-user')
          if ('${{ matrix.arch }}' -eq 'x64') { $contextArgs = @('--restricted-user', '--expect-restricted-user-policy-refusal') }
          python tests/test_native_install.py out/beta-candidate --disposable-host --machine @contextArgs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Retain exact profile inputs
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: wtop-beta-input-${{ matrix.profile }}-${{ github.sha }}
          path: out/beta-candidate/
          if-no-files-found: error
          retention-days: 30
      - name: Retain experimental MSI and failed or successful lifecycle evidence
        if: always() && matrix.arch != 'Win32'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: wtop-msi-candidate-${{ matrix.profile }}-${{ github.sha }}
          path: out/beta-candidate/
          if-no-files-found: warn
          retention-days: 30
      - name: Retain failed and successful native observations
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: wtop-beta-diagnostics-${{ matrix.profile }}-${{ github.sha }}
          path: |
            out/beta-windows/native-tests.xml
            out/beta-windows/Testing/Temporary/LastTest.log
            out/beta-windows/native-tui-observations.json
            out/beta-windows/native-provider-observations.json
            out/beta-windows/native-resource-observations.json
            out/beta-provenance.json
            out/beta-candidate/native-receipt.json
            out/beta-candidate/security-scan.json
            out/beta-candidate/native-install-observations*.json
            out/beta-candidate/native-install-logs*/
          if-no-files-found: warn
          retention-days: 30

  assemble:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Assemble the exact checked profile subset and corresponding source
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.run_id }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          for profile in win-nt-x86 win-nt-x64 win-nt-arm64; do
            gh run download "$RUN_ID" --repo "$GITHUB_REPOSITORY" --name "wtop-beta-input-$profile-$SOURCE_SHA" --dir "out/profiles/$profile"
          done
          python tools/release_bundle.py assemble --input out/profiles/win-nt-x86 --input out/profiles/win-nt-x64 --input out/profiles/win-nt-arm64 --notes docs/beta3-changes.md --output out/beta
          python tools/release_bundle.py verify out/beta
          python tools/prepare_distribution.py prepare --bundle out/beta --output out/distribution-preparation
          python tools/prepare_distribution.py verify --bundle out/beta --output out/distribution-preparation
      - name: Retain verified draft package
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: wtop-beta-${{ github.sha }}
          path: out/beta/
          if-no-files-found: error
          retention-days: 30
      - name: Retain offline channel preparation without publishing listings
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: wtop-distribution-preparation-${{ github.sha }}
          path: out/distribution-preparation/
          if-no-files-found: error
          retention-days: 30

  stage-draft:
    needs: assemble
    if: github.repository == 'Julesc013/wtop' && github.ref == 'refs/heads/master' && (github.event_name == 'push' || inputs.operation == 'stage')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
      - name: Download this run's exact package and stage only a draft
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.run_id }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          gh run download "$RUN_ID" --repo "$GITHUB_REPOSITORY" --name "wtop-beta-$SOURCE_SHA" --dir out/beta
          python tools/publish_beta.py stage out/beta

  publish-explicit-prerelease:
    if: github.repository == 'Julesc013/wtop' && github.ref == 'refs/heads/master' && github.event_name == 'workflow_dispatch' && inputs.operation == 'publish'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Validate exact channel, scan and live-feedback gates, publish and reacquire
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          python tools/publish_beta.py publish "$RELEASE_TAG"
