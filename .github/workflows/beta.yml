name: Wtop portable beta

on:
  push:
    branches: [master, 'work/public-beta-*']
  pull_request:
    branches: [master]
  workflow_dispatch:
    inputs:
      operation:
        description: 'Stage an exact draft, or explicitly publish a reviewed existing draft'
        type: choice
        options: [stage, publish]
        default: stage
      tag:
        description: 'Existing draft tag, required only for publish'
        type: string
        default: v0.4.0-beta.1

permissions:
  contents: read

concurrency:
  group: wtop-beta-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    if: github.event_name != 'workflow_dispatch' || inputs.operation != 'publish'
    runs-on: windows-2025
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Validate specification and release tooling
        shell: pwsh
        run: |
          python tools/specctl.py validate
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tools/command_help.py --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m unittest discover -s tests -p 'test_*.py' -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build the embedded beta version
        shell: pwsh
        run: |
          cmake -S . -B out/beta-windows -A x64
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmake --build out/beta-windows --config Release --parallel 2
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Execute exact x64 native and TUI tests
        shell: pwsh
        run: |
          ctest --test-dir out/beta-windows -C Release --output-on-failure --output-junit native-tests.xml
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Assemble unchanged bytes, source and native receipts
        shell: pwsh
        run: |
          python packaging/record_build.py out/beta-windows out/beta-provenance.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tools/package_candidate.py create --exe out/beta-windows/Release/wtop.exe --output out/beta-candidate --profile win-nt-x64 --provenance out/beta-provenance.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python packaging/native_receipt.py out/beta-candidate --junit out/beta-windows/native-tests.xml --output out/beta-native.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tools/beta_release.py assemble --candidate out/beta-candidate --native out/beta-native.json --junit out/beta-windows/native-tests.xml --notes docs/beta-release-notes.md --output out/beta
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tools/beta_release.py verify out/beta
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Retain exact beta package
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: wtop-beta-${{ github.sha }}
          path: out/beta/
          if-no-files-found: error
          retention-days: 30
      - name: Retain failed and successful native observations
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: wtop-beta-diagnostics-${{ github.sha }}
          path: |
            out/beta-windows/native-tests.xml
            out/beta-windows/Testing/Temporary/LastTest.log
            out/beta-windows/native-tui-observations.json
            out/beta-windows/native-provider-observations.json
            out/beta-provenance.json
          if-no-files-found: warn
          retention-days: 30

  stage-draft:
    needs: build
    if: github.repository == 'Julesc013/wtop' && github.ref == 'refs/heads/master' && (github.event_name == 'push' || inputs.operation == 'stage')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Download this run's exact checked package and stage only a draft
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.run_id }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          gh run download "$RUN_ID" --repo "$GITHUB_REPOSITORY" --name "wtop-beta-$SOURCE_SHA" --dir out/beta
          python tools/publish_beta.py stage out/beta

  publish-reviewed-draft:
    if: github.repository == 'Julesc013/wtop' && github.ref == 'refs/heads/master' && github.event_name == 'workflow_dispatch' && inputs.operation == 'publish'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Validate exact human/desktop/live-feedback gates, publish and reacquire
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          python tools/publish_beta.py publish "$RELEASE_TAG"
